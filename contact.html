<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact - Tristan Hoang</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <button id="theme-toggle" type="button" class="btn btn-outline-secondary btn-sm">Dark Mode</button>
      <a href="index.html">Home</a>
      <a href="project.html">Collection</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.txst.edu" target="_blank" rel="noopener">University</a>
    </nav>
  </header>

  <main id="contact">
    <h2>Contact Form</h2>
    <p>Please fill out the form below to contact me:</p>
    <form id="contact-form">
       <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" rows="4" class="form-control" required></textarea>
        <p id="message-feedback" class="mt-1"></p>
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>
      <p id="form-status" class="mt-3"></p>
    </form>
  </main>
  <script src="script.js"></script>
  <footer>
    <p>&copy; 2026 Tristan Hoang</p>
  </footer>
</body>
</html>
